<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Alleanza Academy · Examen de Práctica Completo (150)</title>
<style>
:root{--brand:#007a78;--brand-strong:#005f5d;--brand-soft:#e3f2f1;--nav:#202a2f;--bg:#f3f5f6;--surface:#fff;--ink:#172126;--muted:#66737a;--line:#d9dfe2;--danger:#bd3c3c;--danger-soft:#fbeaea;--success:#16835d;--success-soft:#e6f4ee;--highlight:#fff1a8;--warn:#b7791f}
html.dark{--bg:#12181b;--surface:#1a2226;--ink:#e6ecef;--muted:#9aa8ae;--line:#2c373c;--brand-soft:#0f3534;--danger-soft:#3a1d1d;--success-soft:#123426;--highlight:#6b5d12}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.top{height:56px;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;z-index:5;border-bottom:3px solid var(--brand)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.tile{width:32px;height:32px;border-radius:4px;background:var(--brand);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.brand b{display:block;font-size:14px}.brand small{display:block;font-size:11px;color:#b8c4c9;white-space:nowrap}
.title{position:absolute;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.title small{display:block;font-size:10px;letter-spacing:.06em;color:#b8c4c9;text-transform:uppercase}.title b{font-size:13px}
.topr{display:flex;gap:8px;align-items:center}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:6px 10px;border-radius:4px;background:#2c393f;display:flex;gap:6px;align-items:center}
.clock.low{background:var(--danger)}
.iconbtn{width:36px;height:36px;border:1px solid #46545a;border-radius:4px;background:transparent;display:grid;place-items:center;color:#fff}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* start */
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:1.5px solid var(--line);border-radius:6px;padding:16px;background:var(--surface);text-align:left;display:flex;gap:12px;align-items:flex-start}
.choice:hover{border-color:var(--brand)}
.choice.on{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.choice .badge{width:40px;height:40px;border-radius:4px;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.choice.on .badge{background:var(--brand)}
.choice b{display:block;margin-bottom:2px}.choice span{font-size:13px;color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:4px;padding:12px;text-align:center;background:var(--surface)}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
ul.cond{margin:8px 0 0;padding-left:18px;line-height:1.6;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:10px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-strong)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}.field>span{font-weight:700;font-size:14px}.field input{width:100%;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink)}.field input:focus{outline:2px solid var(--brand);border-color:var(--brand)}.err{min-height:16px;color:var(--danger);font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{padding:6px 10px;font-size:12px;font-weight:500}
.btn.on{background:var(--highlight);border-color:#d9c25a;color:#172126}
.mt{margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:14px}
/* exam */
.exam{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side h3{display:flex;gap:8px;align-items:center;margin:16px 14px 12px;font-size:14px}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 14px 10px}
.counts div{border:1px solid var(--line);border-radius:3px;text-align:center;padding:6px 0;font-size:11px;color:var(--muted)}.counts b{display:block;color:var(--ink);font-size:14px}
.navscroll{overflow:auto;padding:0 14px;flex:1;min-height:0}
.sechead{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 6px;font-weight:600}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qn{height:34px;border:1px solid var(--line);border-radius:3px;background:var(--surface);font-size:11px;position:relative}
.qn.ans{background:var(--brand-soft);border-color:var(--brand)}
.qn.cur{outline:2px solid var(--brand);outline-offset:1px;font-weight:700}
.qn.flag::after{content:"";position:absolute;top:2px;right:2px;width:0;height:0;border-left:7px solid transparent;border-top:7px solid var(--danger)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);padding:8px 14px}
.legend i{display:inline-block;width:9px;height:9px;border:1px solid var(--line);margin-right:3px;vertical-align:-1px}
.side .fin{margin:8px 14px 14px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.qbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--surface);gap:10px}
.qbar .pos{font-size:13px;color:var(--muted)}
.qbody{flex:1;overflow:auto;padding:26px 44px 30px}
.qinner{max-width:760px;margin:0 auto}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:12px}
.pill{background:var(--brand);color:#fff;font-weight:700;padding:3px 7px;border-radius:2px}
.secpill{background:var(--nav);color:#fff;padding:3px 7px;border-radius:2px;font-weight:600}
.stem{font-size:19px;line-height:1.5;font-weight:700;margin:0 0 10px}
.stem mark{background:var(--highlight);color:inherit}
.hint{font-size:12px;color:var(--muted);margin-bottom:16px}
.opt{display:flex;border:1px solid var(--line);border-radius:3px;background:var(--surface);margin-bottom:10px;min-height:48px}
.opt .pick{flex:1;display:flex;gap:12px;align-items:center;padding:10px 12px;border:0;background:transparent;text-align:left;font-size:14px;line-height:1.4}
.opt .let{width:26px;height:26px;border:1px solid #9aa8ae;border-radius:3px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.opt.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:var(--brand-soft)}
.opt.sel .let{background:var(--brand);border-color:var(--brand);color:#fff}
.opt.struck .txt{text-decoration:line-through;color:var(--muted)}
.opt .cut{width:36px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center}
.opt.struck .cut{color:var(--danger)}
.bottom{display:flex;align-items:center;gap:12px;padding:10px 22px;border-top:1px solid var(--line);background:var(--surface)}
.bottom .btn{min-width:120px}.bottom .status{flex:1;font-size:12px;color:var(--muted);text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,15,18,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:480px;width:100%}
/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.big{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;border:8px solid var(--line)}
.pass{color:var(--success)}.fail{color:var(--danger)}
.big.pass{border-color:var(--success)}.big.fail{border-color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--brand)}
.bar i.lo{background:var(--danger)}
.rv{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:10px;background:var(--surface)}
.rv .st{font-weight:700;margin:6px 0 10px;line-height:1.45}
.rv .o{padding:6px 8px;border-radius:3px;font-size:13px;margin:3px 0;display:flex;gap:8px}
.rv .o.ok{background:var(--success-soft);color:var(--success);font-weight:600}
.rv .o.bad{background:var(--danger-soft);color:var(--danger);text-decoration:line-through}
.rv .ex{font-size:13px;line-height:1.5;margin-top:10px;padding:10px;border-left:3px solid var(--brand);background:var(--bg)}
.rv .wx{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.tag{font-size:11px;padding:2px 6px;border-radius:2px;font-weight:700}
.tag.ok{background:var(--success-soft);color:var(--success)}.tag.bad{background:var(--danger-soft);color:var(--danger)}.tag.na{background:var(--bg);color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.hide{display:none!important}
.mobnav{display:none}
@media (max-width:860px){
 .title{display:none}.brand small{display:none}
 .exam{grid-template-columns:1fr}
 .side{position:fixed;top:56px;bottom:0;left:0;width:280px;z-index:10;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
 .side.open{transform:none}
 .mobnav{display:inline-flex}
 .qbody{padding:18px 16px}.stem{font-size:17px}
 .grid2,.rules{grid-template-columns:1fr 1fr}
 .bottom .btn{min-width:0;flex:1}.bottom .status{display:none}
 .score{grid-template-columns:1fr;justify-items:center;text-align:center}
}
@media (max-width:480px){.qbar .lbl{display:none}.qbar .pos{font-size:12px;white-space:nowrap}.grid2{grid-template-columns:1fr}.qbar{padding:8px 12px}}
</style>
</head>
